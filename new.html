<!DOCTYPE html>
<html>
<head>
  <style>
    /* Target all labels on the page */
    label {
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      font-weight: 600;
      color: #0056b3;
    }

    /* Target a specific label using a class */
    .custom-label {
      font-family: 'Georgia', serif;
      font-size: 18px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- Standard label -->
  <label for="email">Email Address:</label>
  <input type="email" id="email"><br><br>

  <!-- Custom label using a class -->
  <label for="password" class="custom-label">Password:</label>
  <input type="password" id="password">

</body>
</html>
